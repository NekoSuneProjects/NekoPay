name: Apply multichain payment update v2

on:
  push:
    branches:
      - feature/multichain-stablecoin-payments
    paths:
      - .github/workflows/apply-multichain-payments-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply multichain changes
        run: python3 .github/scripts/apply_multichain.py

      - name: Normalize generated docs
        run: python3 -c "from pathlib import Path; p=Path('README.md'); p.write_text(p.read_text(encoding='utf-8').rstrip() + '\\n', encoding='utf-8')"

      - name: Check patch whitespace
        run: git diff --check

      - name: Run NekoPay syntax tests
        run: npm test

      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-multichain-payments-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(payments): enable EVM and TRON stablecoins"
          git push origin "HEAD:${GITHUB_REF_NAME}"
