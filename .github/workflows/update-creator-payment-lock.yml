name: Update creator payment lockfile

on:
  push:
    branches:
      - feature/creator-payments
    paths:
      - package.json
      - vendor/**
      - .github/workflows/update-creator-payment-lock.yml

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: [self-hosted, Linux, docker, buildx]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creator-payments
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: update package lock for creator payments"
          git push origin HEAD:feature/creator-payments
